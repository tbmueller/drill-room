<title>Drill Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a judge's workbench. Top bar (drill, timer, run/submit) over a split: problem sheet left, editor + verdict right. Stacks on phones. */
:root {
  --bg: #f4f6f5;
  --panel: #ffffff;
  --ink: #18201d;
  --muted: #5d6b65;
  --line: #d9e0dc;
  --code-bg: #fbfcfb;
  --gutter: #eef2f0;
  --accent: #1f7a5a;
  --accent-ink: #ffffff;
  --pass: #1f7a5a;
  --fail: #b3412f;
  --warn: #a8710f;
  --chip: #e6efe9;
  --font-ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-code: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111614; --panel: #171e1b; --ink: #e3ebe7; --muted: #94a59d; --line: #2a3531;
    --code-bg: #131917; --gutter: #1b2320; --accent: #4fbf92; --accent-ink: #0c1411;
    --pass: #4fbf92; --fail: #f08a76; --warn: #e3b55a; --chip: #1f2b26; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111614; --panel: #171e1b; --ink: #e3ebe7; --muted: #94a59d; --line: #2a3531;
  --code-bg: #131917; --gutter: #1b2320; --accent: #4fbf92; --accent-ink: #0c1411;
  --pass: #4fbf92; --fail: #f08a76; --warn: #e3b55a; --chip: #1f2b26; color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 14px; }
.app { display: flex; flex-direction: column; height: 100%; padding-inline: 16px; padding-block: 12px; gap: 12px; box-sizing: border-box; }
header.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
.brand { font-weight: 600; font-size: 15px; letter-spacing: 0.01em; margin-right: auto; display: flex; align-items: baseline; gap: 8px; }
.brand small { color: var(--muted); font-weight: 400; font-size: 12px; }
select, button { font: inherit; }
select { background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; max-width: 100%; }
button { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 6px; padding: 6px 12px; cursor: pointer; }
button:hover { border-color: var(--muted); }
button:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
button.ghost { border-color: transparent; background: transparent; color: var(--muted); }
.timer { display: flex; align-items: center; gap: 6px; }
.clock { font-family: var(--font-code); font-variant-numeric: tabular-nums; font-size: 15px; min-width: 5ch; text-align: right; }
.clock.low { color: var(--warn); }
.clock.out { color: var(--fail); }
.split { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); gap: 12px; }
.pane { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; min-height: 0; min-width: 0; display: flex; flex-direction: column; }
.problem { overflow: auto; padding: 18px 20px; }
.names { font-size: 12.5px; color: var(--muted); background: var(--chip); border-radius: 6px; padding: 6px 10px; margin: 0 0 12px; }
.problem h1 { font-size: 18px; margin: 0 0 4px; text-wrap: balance; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.chip { font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase; background: var(--chip); color: var(--muted); border-radius: 999px; padding: 2px 8px; }
.problem p, .problem li { line-height: 1.55; max-width: 65ch; }
.problem h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 18px 0 6px; }
.problem code { font-family: var(--font-code); font-size: 12.5px; background: var(--chip); padding: 1px 4px; border-radius: 4px; }
.problem pre { font-family: var(--font-code); font-size: 12.5px; background: var(--code-bg); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; overflow-x: auto; }
.problem pre code { background: none; padding: 0; }
.problem :not(pre) > code { overflow-wrap: anywhere; }
.problem table { border-collapse: collapse; font-size: 13px; margin: 8px 0 12px; max-width: 100%; display: block; overflow-x: auto; }
.problem th, .problem td { border: 1px solid var(--line); padding: 4px 8px; text-align: left; vertical-align: top; }
.problem th { background: var(--chip); font-weight: 600; }
.right { display: grid; grid-template-rows: minmax(0, 3fr) minmax(0, 2fr); gap: 12px; min-height: 0; min-width: 0; }
.editor-head, .out-head { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.editor-head .lang { font-size: 12px; color: var(--muted); margin-right: auto; }
.editor { flex: 1; min-height: 0; display: flex; background: var(--code-bg); border-radius: 0 0 8px 8px; overflow: hidden; }
.gutter { font-family: var(--font-code); font-size: 13px; line-height: 20px; color: var(--muted); background: var(--gutter); padding: 10px 8px 10px 10px; text-align: right; user-select: none; overflow: hidden; white-space: pre; min-width: 3ch; font-variant-numeric: tabular-nums; }
textarea#code, .gutter, .problem code, .problem pre, .case pre, .output pre { font-variant-ligatures: none; font-feature-settings: "liga" 0, "calt" 0, "dlig" 0; }
textarea#code { flex: 1; min-width: 0; border: 0; resize: none; background: transparent; color: var(--ink); font-family: var(--font-code); font-size: 13px; line-height: 20px; padding: 10px 12px; tab-size: 2; white-space: pre; overflow: auto; outline: none; }
.out-head strong { margin-right: auto; font-size: 13px; }
.verdict { font-weight: 600; }
.verdict.pass { color: var(--pass); }
.verdict.fail { color: var(--fail); }
.output { flex: 1; min-height: 0; overflow: auto; padding: 10px 12px; font-size: 13px; }
.output .hint { color: var(--muted); line-height: 1.55; }
.case { border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; margin-bottom: 8px; }
.case-row { display: flex; align-items: center; gap: 8px; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.dot.pass { background: var(--pass); }
.dot.fail { background: var(--fail); }
.case pre { font-family: var(--font-code); font-size: 12px; margin: 6px 0 0; white-space: pre-wrap; word-break: break-word; }
.label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin-top: 8px; }
.err { color: var(--fail); }
.grid-cases { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
.grid-cases .case { margin: 0; }
.saveinfo { font-size: 12px; color: var(--muted); }
.saveinfo.ok { color: var(--pass); }
.kbd { font-family: var(--font-code); font-size: 11px; color: var(--muted); }
.confirm { display: flex; gap: 6px; align-items: center; font-size: 12px; }
[hidden] { display: none !important; }
.problem h2.part-head { font-size: 15px; text-transform: none; letter-spacing: 0; color: var(--ink); margin: 20px 0 6px; padding-top: 14px; border-top: 1px solid var(--line); }
.part-head.current::after { content: "  ← working on"; font-size: 11px; font-weight: 400; color: var(--accent); letter-spacing: 0.02em; }
.locked { color: var(--muted); font-size: 13px; margin: 14px 0 0; padding-top: 12px; border-top: 1px dashed var(--line); }
.notes { margin-top: 18px; }
.part-label { font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin: 10px 0 4px; }
@media (max-width: 820px) {
  html, body { height: auto; }
  .app { height: auto; }
  .split { grid-template-columns: minmax(0, 1fr); }
  .problem { max-height: none; }
  .right { grid-template-rows: auto auto; }
  .editor { height: 55vh; }
  .output { max-height: 50vh; }
  .brand { width: 100%; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="app">
  <header class="bar">
    <div class="brand"><span id="brandTitle">Drill Room</span> <small>run, then submit</small></div>
    <label class="sr" for="drill" hidden>Drill</label>
    <select id="drill" aria-label="Drill"></select>
    <select id="lang" aria-label="Language"></select>
    <div class="timer" aria-label="Timer">
      <select id="preset" aria-label="Timer length">
        <option value="600">10 min</option>
        <option value="900" selected>15 min</option>
        <option value="1800">30 min</option>
        <option value="3600">60 min</option>
      </select>
      <span class="clock" id="clock">15:00</span>
      <button id="timerBtn" type="button">Start</button>
      <button id="timerReset" type="button" class="ghost">Reset</button>
    </div>
  </header>

  <main class="split">
    <section class="pane problem" id="problem" aria-label="Problem"></section>
    <div class="right">
      <section class="pane" aria-label="Editor">
        <div class="editor-head">
          <span class="lang" id="langNote">TypeScript</span>
          <select id="part" aria-label="Part" hidden></select>
          <span class="confirm" id="resetConfirm" hidden>
            Reset to the starter code?
            <button type="button" id="resetYes">Reset</button>
            <button type="button" id="resetNo" class="ghost">Keep</button>
          </span>
          <button type="button" id="resetBtn" class="ghost">Reset code</button>
          <button type="button" id="saveBtn" title="Ctrl/Cmd + S">Save</button>
          <button type="button" id="runBtn" title="Ctrl/Cmd + Enter">Run</button>
          <button type="button" id="submitBtn" class="primary" title="Ctrl/Cmd + Shift + Enter">Submit</button>
        </div>
        <div class="editor">
          <div class="gutter" id="gutter" aria-hidden="true">1</div>
          <textarea id="code" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off" aria-label="Code editor"></textarea>
        </div>
      </section>
      <section class="pane" aria-label="Results">
        <div class="out-head"><strong id="outTitle">Results</strong><span class="saveinfo" id="saveInfo"></span><span class="verdict" id="verdict"></span></div>
        <div class="output" id="output"></div>
      </section>
    </div>
  </main>
</div>

<script src="/editor.js"></script>
<script>
(function () {
  "use strict";

  // ---------------- Data (from the pack, loaded at the bottom) ----------------
  var PACK, DRILLS, BY_ID = {}, LANG_LABEL = {}, PREFIX = "drillroom.";

  // ---------------- Storage (best effort) ----------------
  function load(key, fallback) {
    try { var v = localStorage.getItem(PREFIX + key); return v === null ? fallback : JSON.parse(v); }
    catch (e) { return fallback; }
  }
  function save(key, value) {
    try { localStorage.setItem(PREFIX + key, JSON.stringify(value)); } catch (e) { /* ignore */ }
  }

  // ---------------- Elements ----------------
  var $ = function (id) { return document.getElementById(id); };

  function start(pack) {
  PACK = pack;
  DRILLS = pack.drills;
  DRILLS.forEach(function (d) { BY_ID[d.id] = d; });
  pack.languages.forEach(function (l) { LANG_LABEL[l.id] = l.id === "typescript" ? "TypeScript · types not checked" : l.label; });
  PREFIX = "drillroom." + pack.key + ".";
  $("brandTitle").textContent = pack.title;
  document.title = pack.title === "Drill Room" ? "Drill Room" : pack.title + " · Drill Room";
  pack.languages.forEach(function (l) {
    var o = document.createElement("option");
    o.value = l.id; o.textContent = l.label;
    $("lang").appendChild(o);
  });

  var drillSel = $("drill"), problem = $("problem"), code = $("code"), gutter = $("gutter");
  var output = $("output"), verdict = $("verdict"), outTitle = $("outTitle");
  var current = load("current", DRILLS[0].id);
  if (!BY_ID[current]) current = DRILLS[0].id;
  // prefLang is what you picked; lang is what the current drill uses (some drills
  // only come in some languages).
  var prefLang = load("lang", pack.languages[0].id);
  if (!LANG_LABEL[prefLang]) prefLang = pack.languages[0].id;
  var lang = prefLang;
  var part = 1, unlocked = 1, partSel = $("part");
  var status = load("status2", {});
  var langSel = $("lang");

  function starter(n) { return BY_ID[n].starters[lang]; }
  function codeKey(n) { return "code." + lang + "." + n; }

  function statusLabel(n) {
    var d = BY_ID[n], l = d.languages.indexOf(prefLang) >= 0 ? prefLang : d.languages[0];
    var s = (status[l] || {})[n];
    if (!s) return "";
    if (s.parts) return (s.partsPassed === s.parts ? "  ✓ " : "  ") + s.partsPassed + "/" + s.parts + " parts";
    if (s.total && s.passed === s.total) return "  ✓ " + s.passed + "/" + s.total;
    if (s.total) return "  " + s.passed + "/" + s.total;
    return s.ran ? "  · tried" : "";
  }
  function renderSelect() {
    drillSel.innerHTML = "";
    PACK.groups.forEach(function (g) {
      var parent = drillSel;
      if (g.title) { parent = document.createElement("optgroup"); parent.label = g.title; drillSel.appendChild(parent); }
      g.drills.forEach(function (id) {
        var d = BY_ID[id];
        var o = document.createElement("option");
        o.value = d.id;
        o.textContent = d.number + ". " + d.title + statusLabel(d.id);
        parent.appendChild(o);
      });
    });
    drillSel.value = current;
  }

  function showDrill(n) {
    current = n;
    save("current", n);
    problem.innerHTML = "";
    var d = BY_ID[n];
    lang = d.languages.indexOf(prefLang) >= 0 ? prefLang : d.languages[0];
    Array.prototype.forEach.call(langSel.options, function (o) { o.disabled = d.languages.indexOf(o.value) < 0; });
    if (!ticking && d.timer) { $("preset").value = String(d.timer * 60); remaining = d.timer * 60; drawClock(); }
    if (PACK.notes[lang]) problem.appendChild(el("p", "names", PACK.notes[lang]));
    if (lang !== prefLang) problem.appendChild(el("p", "names", "This one is " + LANG_LABEL[lang].split(" ·")[0] + " only."));
    problem.appendChild(el("h1", "", d.number + ". " + d.title));
    var chips = [d.difficulty, d.time].concat(d.tags).filter(Boolean);
    if (chips.length) {
      var meta = el("div", "meta");
      chips.forEach(function (c) { meta.appendChild(el("span", "chip", c)); });
      problem.appendChild(meta);
    }
    var body = el("div", "statement");
    body.innerHTML = d.html; // rendered by the server from the Markdown statement, with all HTML escaped
    problem.appendChild(body);
    var partsBox = el("div", "parts");
    problem.appendChild(partsBox);
    partSel.hidden = !d.multipart;
    part = 1; unlocked = 1;
    if (d.multipart) loadState(n, null);
    $("langNote").textContent = LANG_LABEL[lang];
    langSel.value = lang;
    problem.scrollTop = 0;
    var local = load(codeKey(n), null);
    code.value = local || starter(n);
    syncGutter();
    $("saveInfo").textContent = "";
    if (!local) {
      // Nothing in this browser yet: pick up the copy saved in the repo, if any.
      var want = lang + ":" + n;
      fetch("/api/solution?lang=" + encodeURIComponent(lang) + "&drill=" + encodeURIComponent(n))
        .then(function (r) { return r.json(); })
        .then(function (j) {
          if (j.code && lang + ":" + current === want && code.value === starter(n)) {
            code.value = j.code; syncGutter(); save(codeKey(n), code.value);
            $("saveInfo").textContent = "Loaded your saved solution";
          }
        }).catch(function () { /* offline: keep the starter */ });
    }
    code.scrollTop = 0;
    clearOutput();
    renderSelect();
  }

  // Multi-part drills: which parts are open, their statements, and the notes.
  function loadState(n, justUnlocked) {
    fetch("/api/state?drill=" + encodeURIComponent(n)).then(function (r) { return r.json(); }).then(function (st) {
      if (current !== n) return;
      unlocked = st.unlocked;
      var want = justUnlocked || load("part." + n, unlocked);
      part = Math.min(Math.max(1, want), unlocked);
      save("part." + n, part);
      partSel.innerHTML = "";
      st.parts.forEach(function (p) {
        var o = document.createElement("option");
        o.value = String(p.number);
        o.textContent = "Part " + p.number + (p.html === null ? " 🔒" : "");
        o.disabled = p.html === null;
        partSel.appendChild(o);
      });
      partSel.value = String(part);
      var box = problem.querySelector(".parts");
      box.innerHTML = "";
      st.parts.forEach(function (p) {
        if (p.html === null) {
          box.appendChild(el("p", "locked", "🔒 " + p.title + ": unlocks when part " + (p.number - 1) + "'s hidden tests all pass."));
          return;
        }
        box.appendChild(el("h2", "part-head" + (p.number === part ? " current" : ""), p.title));
        var b = el("div", "statement");
        b.innerHTML = p.html;
        box.appendChild(b);
      });
      if (st.notesHtml) {
        var notes = el("div", "statement notes");
        notes.innerHTML = st.notesHtml;
        box.appendChild(notes);
      }
      if (justUnlocked) {
        var head = box.querySelectorAll(".part-head")[part - 1];
        if (head) head.scrollIntoView({ block: "start" });
      }
    }).catch(function () { /* the server is down; Run/Submit will say so */ });
  }

  function showSaved(saved) {
    var si = $("saveInfo");
    if (!saved) { si.textContent = ""; return; }
    si.textContent = "Saved " + saved.lastSaved.slice(11) + " · " + saved.status;
    si.className = "saveinfo" + (saved.status.indexOf("PASSED") === 0 ? " ok" : "");
  }

  function doSave() {
    save(codeKey(current), code.value);
    fetch("/api/save", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ lang: lang, drill: current, code: code.value })
    }).then(function (r) { return r.json(); })
      .then(function (j) { showSaved(j.saved); })
      .catch(function () { $("saveInfo").textContent = "Couldn't save to disk. Is the server running?"; });
  }

  function clearOutput() {
    verdict.textContent = "";
    verdict.className = "verdict";
    outTitle.textContent = "Results";
    output.innerHTML = '<p class="hint"><strong>Run</strong> checks the visible example and shows expected vs. your output. ' +
      '<strong>Submit</strong> runs the hidden tests and only tells you which ones failed, like the real thing. ' +
      'Your code autosaves in this browser as you type. Save, Run and Submit also write it to the pack\'s <code>solutions/</code> folder with its status and date.</p>' +
      '<p class="hint kbd">Ctrl/Cmd+S: Save · Ctrl/Cmd+Enter: Run · Ctrl/Cmd+Shift+Enter: Submit · Alt/Option+↑↓: move line · Tab: indent</p>';
  }

  // ---------------- Editor behaviour ----------------
  function syncGutter() {
    var lines = code.value.split("\n").length;
    var s = "";
    for (var i = 1; i <= lines; i++) s += i + "\n";
    gutter.textContent = s;
    gutter.scrollTop = code.scrollTop;
  }
  code.addEventListener("scroll", function () { gutter.scrollTop = code.scrollTop; });
  var saveTimer = null;
  code.addEventListener("input", function () {
    syncGutter();
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function () { save(codeKey(current), code.value); }, 300);
  });
  // Replace a range through execCommand so the browser's undo stack keeps working.
  function replaceRange(start, end, text, selStart, selEnd) {
    code.focus();
    code.setSelectionRange(start, end);
    var ok = false;
    try { ok = document.execCommand("insertText", false, text); } catch (e) { ok = false; }
    if (!ok) {
      code.setRangeText(text, start, end, "end");
      code.dispatchEvent(new Event("input"));
    }
    if (typeof selStart === "number") code.setSelectionRange(selStart, typeof selEnd === "number" ? selEnd : selStart);
  }

  function applyEdit(edit) {
    if (edit) replaceRange(edit.start, edit.end, edit.text, edit.selStart, edit.selEnd);
  }

  code.addEventListener("keydown", function (ev) {
    var mod = ev.metaKey || ev.ctrlKey;
    if (mod && (ev.key === "s" || ev.key === "S")) {
      ev.preventDefault();
      doSave();
      return;
    }
    var E = window.DrillEditor, v = code.value, ss = code.selectionStart, se = code.selectionEnd;
    if (ev.altKey && !mod && (ev.key === "ArrowUp" || ev.key === "ArrowDown")) {
      ev.preventDefault();
      applyEdit(E.moveLines(v, ss, se, ev.key === "ArrowUp" ? -1 : 1));
      return;
    }
    if (mod && ev.key === "Enter") {
      ev.preventDefault();
      if (ev.shiftKey) doSubmit(); else doRun();
      return;
    }
    if (ev.key === "Tab") {
      ev.preventDefault();
      applyEdit(ev.shiftKey ? E.outdent(v, ss, se) : E.indent(v, ss, se));
      return;
    }
    if (ev.key === "Enter" && !mod) {
      ev.preventDefault();
      applyEdit(E.newline(v, ss, se));
    }
  });

  // ---------------- Execution (local judge server) ----------------
  function canon(v) {
    if (Array.isArray(v)) return v.map(canon);
    if (v && typeof v === "object") {
      var out = {};
      Object.keys(v).sort().forEach(function (k) { out[k] = canon(v[k]); });
      return out;
    }
    return v;
  }

  function execute(mode) {
    return fetch("/api/judge", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ lang: lang, drill: current, part: part, code: code.value, mode: mode })
    }).then(function (r) {
      return r.json().then(function (j) {
        if (!r.ok) return { fatal: j.error || ("Server error " + r.status) };
        return j;
      });
    }).catch(function () {
      return { fatal: "Can't reach the judge server. Is the Drill Room server still running in your terminal?" };
    });
  }

  function same(a, b) { return JSON.stringify(canon(a)) === JSON.stringify(canon(b)); }
  function pretty(v) { return typeof v === "string" ? JSON.stringify(v) + (v.indexOf("\n") !== -1 ? "\n\n" + v : "") : JSON.stringify(v, null, 1).replace(/\n\s*/g, " "); }
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }
  function setVerdict(ok, text) { verdict.textContent = text; verdict.className = "verdict " + (ok ? "pass" : "fail"); }
  function busy(on) { $("runBtn").disabled = on; $("submitBtn").disabled = on; }

  function showFatal(msg) {
    output.innerHTML = "";
    output.appendChild(el("pre", "err", msg));
    setVerdict(false, "Error");
  }

  function partTag() { return BY_ID[current].multipart ? "Part " + part + " · " : ""; }

  function doRun() {
    var n = current;
    save(codeKey(n), code.value);
    busy(true);
    outTitle.textContent = "Run · " + partTag() + "sample tests";
    output.innerHTML = '<p class="hint">Running…</p>';
    execute("run").then(function (res) {
      busy(false);
      showSaved(res.saved);
      if (res.fatal) { showFatal(res.fatal); return; }
      output.innerHTML = "";
      if (!res.cases.length) {
        verdict.textContent = ""; verdict.className = "verdict";
        output.appendChild(el("p", "hint", "This part has no sample cases. Submit to run its hidden tests."));
        return;
      }
      var ok = res.cases.every(function (r) { return r.pass; });
      var many = res.cases.length > 1;
      status[lang] = status[lang] || {};
      status[lang][n] = Object.assign({}, status[lang][n], { ran: true });
      save("status2", status); renderSelect();
      setVerdict(ok, ok ? "Passed" : "Failed");
      res.cases.forEach(function (r, i) {
        var box = el("div", "case");
        var row = el("div", "case-row");
        row.appendChild(el("span", "dot " + (r.pass ? "pass" : "fail")));
        row.appendChild(el("strong", "", "Sample test case" + (many ? " " + (i + 1) : "")));
        box.appendChild(row);
        box.appendChild(el("div", "label", "Input"));
        box.appendChild(el("pre", "", JSON.stringify(r.args)));
        box.appendChild(el("div", "label", "Expected"));
        box.appendChild(el("pre", "", pretty(r.expected)));
        box.appendChild(el("div", "label", "Your output"));
        box.appendChild(el("pre", r.ok ? "" : "err", r.ok ? pretty(r.got) : r.error));
        if (r.logs && r.logs.length) {
          box.appendChild(el("div", "label", "Console"));
          box.appendChild(el("pre", "", r.logs.join("\n")));
        }
        output.appendChild(box);
      });
      if (ok) output.appendChild(el("p", "hint", (many ? "Samples pass" : "Sample passes") + ". Now Submit to run the hidden tests."));
    });
  }

  function caseGrid(cases) {
    var grid = el("div", "grid-cases");
    cases.forEach(function (r, i) {
      var box = el("div", "case");
      var row = el("div", "case-row");
      row.appendChild(el("span", "dot " + (r.pass ? "pass" : "fail")));
      row.appendChild(el("span", "", "Test case " + (i + 1)));
      box.appendChild(row);
      if (!r.pass) box.appendChild(el("pre", r.error ? "err" : "", r.error ? r.error : "Wrong answer"));
      grid.appendChild(box);
    });
    return grid;
  }

  function doSubmit() {
    var n = current, d = BY_ID[n], before = unlocked;
    save(codeKey(n), code.value);
    busy(true);
    outTitle.textContent = "Submit · " + (d.multipart ? (part > 1 ? "parts 1–" + part + " · " : "part 1 · ") : "") + "hidden tests";
    output.innerHTML = '<p class="hint">Running hidden tests…</p>';
    execute("submit").then(function (res) {
      busy(false);
      showSaved(res.saved);
      if (res.fatal) { showFatal((res.part ? "Part " + res.part + ": " : "") + res.fatal); return; }
      output.innerHTML = "";
      status[lang] = status[lang] || {};
      if (d.multipart) {
        var allPass = true, firstFail = null;
        res.parts.forEach(function (p) {
          var passed = p.cases.filter(function (c) { return c.pass; }).length;
          if (passed !== p.cases.length) { allPass = false; if (firstFail === null) firstFail = p.part; }
          output.appendChild(el("div", "part-label", "Part " + p.part + ": " + passed + "/" + p.cases.length + (passed === p.cases.length ? " ✓" : "")));
          output.appendChild(caseGrid(p.cases));
        });
        var prev = (status[lang][n] || {}).partsPassed || 0;
        status[lang][n] = { ran: true, parts: d.parts.length, partsPassed: Math.max(prev, allPass ? part : (firstFail || 1) - 1) };
        setVerdict(allPass, allPass ? "Part " + part + (part > 1 ? " and earlier" : "") + " pass" : "Part " + firstFail + " failing");
        var tip;
        if (res.unlocked > before) tip = "Part " + res.unlocked + " is unlocked: its statement is in the problem pane.";
        else if (allPass && part === d.parts.length) tip = "Every part passes. Try it again from scratch in a few days, timed.";
        else if (allPass && part < unlocked) tip = "Passing. Part " + (part + 1) + " is already open; switch to it above the editor.";
        else if (!allPass && firstFail < part) tip = "Part " + firstFail + " broke: a change for this part changed earlier behaviour.";
        else tip = "Re-read the spec before re-reading your code: a failing hidden case is usually a rule you skimmed (empty input, ties, boundaries, ordering, negatives).";
        output.appendChild(el("p", "hint", tip));
        save("status2", status); renderSelect();
        if (res.unlocked > before) loadState(n, res.unlocked);
        return;
      }
      var passed = res.cases.filter(function (r) { return r.pass; }).length, total = res.cases.length;
      status[lang][n] = { ran: true, passed: passed, total: total };
      save("status2", status); renderSelect();
      setVerdict(passed === total, passed + "/" + total + " passed");
      output.appendChild(caseGrid(res.cases));
      output.appendChild(el("p", "hint", passed === total
        ? "All hidden tests pass. Try it again from scratch in a few days, timed."
        : "Re-read the spec before re-reading your code: a failing hidden case is usually a rule you skimmed (empty input, ties, boundaries, ordering, negatives)."));
    });
  }

  // ---------------- Timer ----------------
  var remaining = Number($("preset").value), ticking = null;
  function drawClock() {
    var m = Math.floor(Math.abs(remaining) / 60), s = Math.abs(remaining) % 60;
    var c = $("clock");
    c.textContent = (remaining < 0 ? "-" : "") + String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
    c.className = "clock" + (remaining <= 0 ? " out" : remaining <= 300 ? " low" : "");
  }
  $("timerBtn").addEventListener("click", function () {
    if (ticking) { clearInterval(ticking); ticking = null; this.textContent = "Resume"; return; }
    this.textContent = "Pause";
    ticking = setInterval(function () { remaining--; drawClock(); }, 1000);
  });
  $("timerReset").addEventListener("click", function () {
    clearInterval(ticking); ticking = null;
    remaining = Number($("preset").value);
    $("timerBtn").textContent = "Start"; drawClock();
  });
  $("preset").addEventListener("change", function () {
    if (!ticking) { remaining = Number(this.value); drawClock(); }
  });

  // ---------------- Wiring ----------------
  langSel.addEventListener("change", function () {
    save(codeKey(current), code.value);
    prefLang = this.value; save("lang", prefLang);
    showDrill(current);
  });
  partSel.addEventListener("change", function () {
    part = Number(this.value);
    save("part." + current, part);
    loadState(current, null);
    clearOutput();
  });
  drillSel.addEventListener("change", function () { save(codeKey(current), code.value); showDrill(this.value); });
  $("saveBtn").addEventListener("click", doSave);
  $("runBtn").addEventListener("click", doRun);
  $("submitBtn").addEventListener("click", doSubmit);
  $("resetBtn").addEventListener("click", function () { $("resetConfirm").hidden = false; this.hidden = true; });
  $("resetNo").addEventListener("click", function () { $("resetConfirm").hidden = true; $("resetBtn").hidden = false; });
  $("resetYes").addEventListener("click", function () {
    code.value = starter(current); syncGutter(); save(codeKey(current), code.value);
    $("resetConfirm").hidden = true; $("resetBtn").hidden = false; clearOutput();
  });

  drawClock();
  showDrill(current);
  }

  fetch("/api/pack").then(function (r) { return r.json(); }).then(start).catch(function (e) {
    $("problem").textContent = "Couldn't load the problem pack: " + e.message + ". Is the Drill Room server running?";
  });
})();
</script>
